name: CI
on:
  push:
    branches: [main, include-ui-demo]
    tags: ['v*']
  pull_request:
    branches: [main, include-ui-demo]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  backend-unit:
    name: Backend / Build & Unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore enterprise-rag-platform.sln
      - run: dotnet build enterprise-rag-platform.sln -c Release --no-restore -warnaserror
      - run: |
          dotnet test enterprise-rag-platform.sln -c Release --no-build --filter "Category!=Integration" --logger trx --results-directory test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-results
          path: |
            test-results
            evals/results
  backend-integration:
    name: Backend / Integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore enterprise-rag-platform.sln
      - run: dotnet build enterprise-rag-platform.sln -c Release --no-restore -warnaserror
      - run: |
          docker info
          dotnet test tests/Rag.Integration.Tests -c Release --no-build --logger trx --results-directory test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-integration-results
          path: |
            test-results
            evals/results
  deterministic:
    name: Evaluation / Deterministic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore enterprise-rag-platform.sln
      - run: dotnet build enterprise-rag-platform.sln -c Release --no-restore -warnaserror
      - run: |
          dotnet test tests/Rag.Evals.Tests -c Release --no-build
          dotnet run --project evals/Rag.Evals -c Release --no-build -- report --write
          git diff --exit-code -- README.md evals/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-results
          path: |
            test-results
            evals/results
  frontend:
    name: Frontend / Quality & Build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/Rag.Playground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Rag.Playground/package-lock.json
      - run: npm ci
      - run: npm run fixtures:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-diagnostics
          path: |
            src/Rag.Playground/test-results
            src/Rag.Playground/playwright-report
  browser:
    name: Frontend / Browser & Visual
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    defaults:
      run:
        working-directory: src/Rag.Playground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Rag.Playground/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          VISUAL: "1"
          RAG_PLAYGROUND_MODE: demo
          RAG_API_URL: http://127.0.0.1:9
          RAG_API_KEY: deliberately-configured-demo-sentinel
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: |
            src/Rag.Playground/test-results
            src/Rag.Playground/playwright-report
  client:
    name: Client / End-to-End
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/Rag.Playground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Rag.Playground/package-lock.json
      - run: npm ci
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build enterprise-rag-platform.sln -c Release -warnaserror
        working-directory: .
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/client-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: client-diagnostics
          path: |
            src/Rag.Playground/test-results
            src/Rag.Playground/playwright-report
  compose:
    name: Deployment / Compose Smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/compose-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-load-evidence
          path: test-results/compose-load.json
  release:
    name: Build packages & release
    # Runs only after build & test succeed, and only for version tag pushes
    # (e.g. v1.2.3). Pushes to main and pull requests stop after build-test.
    needs: [backend-unit, backend-integration, deterministic, frontend, browser, client, compose]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore enterprise-rag-platform.sln

      - name: Pack Rag.Core (NuGet package)
        run: >-
          dotnet pack src/Rag.Core/Rag.Core.csproj
          --configuration Release
          -p:Version=${{ steps.version.outputs.value }}
          -p:IncludeSymbols=true
          -p:SymbolPackageFormat=snupkg
          --output ./artifacts

      - name: Pack provider packages (NuGet packages)
        # dotnet pack takes a single project or solution argument, so each opt-in provider project
        # (Rag.Core's satellite packages) is packed in its own invocation, same as Rag.Core above.
        run: |
          for project in \
            src/Rag.Providers.Aws/Rag.Providers.Aws.csproj \
            src/Rag.Providers.AzureBlob/Rag.Providers.AzureBlob.csproj \
            src/Rag.Providers.Cosmos/Rag.Providers.Cosmos.csproj \
            src/Rag.Providers.Mongo/Rag.Providers.Mongo.csproj; do
            dotnet pack "$project" \
              --configuration Release \
              -p:Version=${{ steps.version.outputs.value }} \
              -p:IncludeSymbols=true \
              -p:SymbolPackageFormat=snupkg \
              --output ./artifacts
          done

      - name: Publish Rag.Api
        run: >-
          dotnet publish src/Rag.Api/Rag.Api.csproj
          --configuration Release
          -p:Version=${{ steps.version.outputs.value }}
          --output ./publish/Rag.Api

      - name: Publish Rag.Cli
        run: >-
          dotnet publish src/Rag.Cli/Rag.Cli.csproj
          --configuration Release
          -p:Version=${{ steps.version.outputs.value }}
          --output ./publish/Rag.Cli

      - name: Archive published apps
        run: |
          version="${{ steps.version.outputs.value }}"
          (cd publish && zip -r "../artifacts/Rag.Api-${version}.zip" Rag.Api)
          (cd publish && zip -r "../artifacts/Rag.Cli-${version}.zip" Rag.Cli)

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: ./artifacts/**

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" ./artifacts/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $prerelease
